<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>COOOL APOCALYPSE 4D+</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #000000, #0a0a23);
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script type="module">
  import * as THREE from 'https://cdn.skypack.dev/three@0.150.1';

  const canvas = document.querySelector('#game');
  const renderer = new THREE.WebGLRenderer({ canvas });
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1, 5);

  const clock = new THREE.Clock();

  const ambient = new THREE.AmbientLight(0xffffff, 0.5);
  const pointLight = new THREE.PointLight(0xff00ff, 2, 50);
  pointLight.position.set(0, 5, 10);
  scene.add(ambient, pointLight);

  const tunnelGeometry = new THREE.CylinderGeometry(5, 5, 200, 32, 1, true);
  const tunnelMaterial = new THREE.MeshBasicMaterial({
    side: THREE.BackSide,
    map: new THREE.TextureLoader().load('https://i.imgur.com/hG3eXva.jpeg'),
    transparent: true,
    opacity: 0.8
  });
  const tunnel = new THREE.Mesh(tunnelGeometry, tunnelMaterial);
  tunnel.rotation.x = Math.PI / 2;
  scene.add(tunnel);

  const playerGeo = new THREE.IcosahedronGeometry(0.5, 2);
  const playerMat = new THREE.MeshStandardMaterial({ color: '#00ffff', emissive: '#00ffff' });
  const player = new THREE.Mesh(playerGeo, playerMat);
  scene.add(player);

  const obstacles = [];
  const obstacleGeo = new THREE.TorusGeometry(0.7, 0.2, 8, 16);
  const obstacleMat = new THREE.MeshStandardMaterial({ color: '#ff0080', emissive: '#ff0080' });

  for (let i = 0; i < 40; i++) {
    const obs = new THREE.Mesh(obstacleGeo, obstacleMat);
    obs.position.z = -i * 5;
    obs.position.x = Math.sin(i) * 2;
    obs.position.y = Math.cos(i) * 2;
    scene.add(obs);
    obstacles.push(obs);
  }

  // LLAMAS!!!
  const llamaTexture = new THREE.TextureLoader().load('https://i.imgur.com/BjkYFtE.png');
  const llamaMat = new THREE.SpriteMaterial({ map: llamaTexture });
  for (let i = 0; i < 10; i++) {
    const llama = new THREE.Sprite(llamaMat);
    llama.position.set(Math.sin(i) * 4, Math.cos(i) * 4, -i * 20);
    llama.scale.set(1.5, 1.5, 1.5);
    scene.add(llama);
  }

  let left = false, right = false, up = false, down = false;

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') left = true;
    if (e.key === 'ArrowRight') right = true;
    if (e.key === 'ArrowUp') up = true;
    if (e.key === 'ArrowDown') down = true;
  });
  document.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft') left = false;
    if (e.key === 'ArrowRight') right = false;
    if (e.key === 'ArrowUp') up = false;
    if (e.key === 'ArrowDown') down = false;
  });

  let score = 0;
  const scoreDiv = document.createElement('div');
  scoreDiv.style.position = 'absolute';
  scoreDiv.style.top = '10px';
  scoreDiv.style.left = '50%';
  scoreDiv.style.transform = 'translateX(-50%)';
  scoreDiv.style.color = '#fff';
  scoreDiv.style.fontSize = '32px';
  scoreDiv.style.fontFamily = 'monospace';
  scoreDiv.innerText = 'SCORE: 0';
  document.body.appendChild(scoreDiv);

  function animate() {
    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    if (left) player.position.x -= delta * 5;
    if (right) player.position.x += delta * 5;
    if (up) player.position.y += delta * 5;
    if (down) player.position.y -= delta * 5;

    player.position.z -= delta * 10;
    camera.position.z = player.position.z + 5;
    tunnel.position.z = player.position.z;

    for (const obs of obstacles) {
      if (obs.position.distanceTo(player.position) < 1) {
        scoreDiv.innerText = '💥 GAME OVER 💥';
        return;
      }
    }

    score += delta * 10;
    scoreDiv.innerText = `SCORE: ${Math.floor(score)}`;

    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
